services:

  kafka:
    image: apache/kafka:4.2.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://localhost:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - orchestrator-saga
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: redpanda-console
    ports:
      - "8081:8080"
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:29092"]
    networks:
      - orchestrator-saga
    depends_on:
      kafka:
        condition: service_healthy

  order-db:
    image: mongo:8.0
    container_name: order-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    networks:
      - orchestrator-saga

  product-db:
    image: postgres:17
    container_name: product-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    networks:
      - orchestrator-saga

  payment-db:
    image: postgres:17
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    networks:
      - orchestrator-saga

  inventory-db:
    image: postgres:17
    container_name: inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    networks:
      - orchestrator-saga

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    networks:
      - orchestrator-saga

  order-service:
    build: "./order-service"
    container_name: order-service
    environment:
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: admin
      MONGO_DB_HOST: order-db
      MONGO_DB_PORT: 27017
      KAFKA_BROKER: kafka:29092
    ports:
      - "3000:3000"
    networks:
      - orchestrator-saga
    depends_on:
      - order-db
      - kafka

  orchestrator-service:
    build: "./orchestrator-service"
    container_name: orchestrator-service
    environment:
      KAFKA_BROKER: kafka:29092
    ports:
      - "8080:8080"
    networks:
      - orchestrator-saga
    depends_on:
      - kafka

  product-validation-service:
    build: "./product-validation-service"
    container_name: product-validation-service
    environment:
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:29092
    ports:
      - "8090:8090"
    networks:
      - orchestrator-saga
    depends_on:
      - product-db
      - kafka

  payment-service:
    build: "./payment-service"
    container_name: payment-service
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:29092
    ports:
      - "8091:8091"
    networks:
      - orchestrator-saga
    depends_on:
      - kafka
      - payment-db

  inventory-service:
    build: "./inventory-service"
    container_name: inventory-service
    environment:
      DB_HOST: inventory-db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKER: kafka:29092
    ports:
      - "8092:8092"
    networks:
      - orchestrator-saga
    depends_on:
      - inventory-db
      - kafka

networks:
  orchestrator-saga:
