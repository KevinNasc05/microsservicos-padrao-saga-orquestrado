spring:
  application:
    name: order-service

  data:
    mongodb:
      database: admin
      uri: mongodb://${MONGO_DB_USER:admin}:${MONGO_DB_PASSWORD:admin}@${MONGO_DB_HOST:localhost}:${MONGO_DB_PORT:27017}

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: order-group
      auto-offset-reset: latest
    topic:
      start-saga: start-saga
      notify-ending: notify-ending

logging:
  level:
    org:
      apache:
        kafka: OFF

server:
  port: 3000
